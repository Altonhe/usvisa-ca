# ---------------------------------------------------------------------------
# US visa appointment watcher -- the one and only application config file.
#
# Copy to config.yaml and edit. config.yaml is gitignored; keep it that way,
# because credentials live in it.
#
#   config.yaml   application config, including secrets   <- this file
#   .env          Docker knobs only (published port, TZ)  <- read by Compose
#   data/         the JSON store the app writes at runtime
#
# ${VAR} placeholders are still expanded from the environment if you prefer to
# inject something that way, but nothing here requires it.
# ---------------------------------------------------------------------------

# TEST MODE. Polls and reports matches but never submits a booking.
# Leave it true until you have watched a few sweeps and trust the output.
test_mode: true

# Seconds between sweeps. Every sweep hits one JSON endpoint per
# (application x consulate). Going below ~180 is asking to be rate limited.
poll_interval: 300

# --- Pacing ---------------------------------------------------------------
# These four had no entry in this file and were silently using the defaults
# below. They are listed explicitly because account_poll_delay in particular
# dominates how long a sweep takes, and you cannot tune what you cannot see.

# Seconds to wait between accounts inside one sweep. Paid once per extra
# account, every sweep: with two accounts that is a flat 10s added to every
# sweep regardless of how fast the requests themselves are. Lower it if your
# sweep wall time matters more than spreading load across accounts.
account_poll_delay: 10

# Seconds between individual availability requests when they are NOT being run
# concurrently. Still applies in three places: between the continue_actions
# pages during discovery, between members of a group (joint constraint), and
# in the availability fetch whenever max_concurrent_requests is 1.
consulate_poll_delay: 2

# Per-request timeout. The site's own TTFB is a few hundred ms, so this only
# trips on a genuine stall.
http_timeout: 30

# Consecutive failures on one account before a Telegram alert fires. The bot
# keeps retrying either way; this only controls when it tells you.
max_consecutive_failures: 5

# The site intermittently reports a schedule as completed/locked (or an
# account as holding nothing actionable) when the response is really just a
# transient glitch. Require "nothing actionable any more" to hold for this
# many sweeps in a row before the poller stops -- so one bad response cannot
# end polling for good. A fully *booked* set still stops immediately, since a
# booked appointment does not revert.
done_confirmations: 5

# --- Request efficiency -----------------------------------------------------
# The site is HTTP/1.1 with no multiplexing, and each round trip costs roughly
# 200-500ms, so the win comes from making fewer, better-overlapped requests
# rather than simply polling harder.

# Discovery (the landing page plus one continue_actions page per application)
# is all HTML, dwarfs days.json, and contains no availability at all. What it
# reports changes at most once, so it is cached this long instead of being
# repaid every sweep. Dropped early whenever the answer could really have
# changed: a booking landed, or the session lapsed.
discovery_interval: 900

# days.json calls that may be in flight at once. This replaces paying
# consulate_poll_delay serially between every consulate, which on a few
# applications turned a handful of 200ms calls into a 20+ second sweep.
# Each slot is a separate TCP connection, so treat this as a footprint knob.
# Set to 1 to restore the old strictly-sequential, delayed behaviour.
max_concurrent_requests: 3

# Collapse availability requests the server itself reports as the same
# resource. days.json for a given (visa class, consulate) is byte-identical
# across sibling applications -- the server returns one ETag for all of them --
# so one request can answer for every member of that class. The grouping is
# never guessed from this file: it is observed from those ETags at runtime.
calendar_sharing: true
# Sweeps between forced re-observation. Every Nth sweep polls each application
# separately and re-derives the grouping, so a class that stops being identical
# splits itself back apart on its own. Costs the full request count once per N.
calendar_reverify_sweeps: 10

# --- Booking speed ----------------------------------------------------------
# Seconds a pre-fetched booking form stays usable. The appointment page costs a
# full round trip plus parsing before a single useful byte is sent, and that is
# exactly the window in which somebody else takes the slot. Holding its
# authenticity_token and hidden fields ready means a match only pays
# times.json plus the POST. Refreshed between sweeps, never on the hot path.
booking_prewarm_ttl: 120

# Fire the POST with a remembered time in parallel with times.json, saving one
# round trip on a match. Off by default, deliberately: what the site does with
# a POST naming an unavailable time cannot be established without sending one.
speculative_booking: false

# --- Adaptive polling -------------------------------------------------------
# Spend a fixed hourly request budget where it can actually win something.
# Slots are released during business hours, so polling every few minutes
# overnight buys nothing that polling fast by day would not.
#
# Hours are read AT THE CONSULATE, not on the machine running this. Slots are
# released by the post, so its business hours are what matter, and Canada spans
# 4.5 timezones: 08:00 in Toronto is 05:00 in Vancouver. Each post's zone is
# built in (see app/consulates.py TIMEZONES), so TZ in .env only affects how
# log timestamps are rendered -- it has no bearing on scheduling.
#
# A sweep covers every account at once and cannot be sped up for one consulate
# alone, so the window counts as open when ANY watched post is inside it.
#
# Leave fast_poll_interval at 0 to disable and use poll_interval around clock.
# active_hours accepts [[9, 17], [20, 22]] or the shorthand "9-17, 20-22";
# the start hour is inclusive and the end hour exclusive, and a window may
# wrap midnight (for example [22, 6]).
fast_poll_interval: 0
active_hours: []

# A day can show as available in /days.json and then be empty in /times.json
# a few seconds later -- someone else took the last slot in between. On a
# match, book() re-checks /times.json this many times, waiting
# booking_retry_delay seconds between checks, before giving up on that day
# until the next full sweep.
booking_retry_attempts: 3
booking_retry_delay: 2

# Where the app keeps its JSON store (store.json is created inside).
data_dir: data

# Locale segment used in every URL: ais.usvisa-info.com/{locale}/niv/...
# Change only if your account lives on a different country site.
locale: en-ca

# Sent as the User-Agent header. Leave it alone unless you have a reason; a
# browser-shaped value is the least interesting thing about your traffic.
# user_agent: ""

# CapSolver key. Only needed when the site decides to arm reCAPTCHA -- it is
# dormant on a clean session. Without a key an armed challenge fails the login.
# https://docs.capsolver.com/en/api/
capsolver_api_key: ""

telegram:
  # 1. /newbot to @BotFather, copy the token it replies with
  # 2. send your new bot a message (it cannot see you otherwise), then read
  #    chat.id from https://api.telegram.org/bot<TOKEN>/getUpdates
  # Verify with:  uv run usvisa --test-telegram
  bot_token: ""
  chat_id: ""
  # Also ping after a sweep that found nothing. Noisy; off by default.
  notify_on_no_availability: false

# Metrics are pushed to New Relic after every sweep -- no agent, no sidecar,
# just an HTTPS POST. The free tier is far more than this volume needs.
# license_key is the ingest key: Account settings -> API keys ->
# "INGEST - LICENSE". It is NOT a user API key.
# Check it with:  uv run usvisa --test-newrelic
newrelic:
  license_key: ""
  region: us            # us | eu | jp -- must match your account's data centre
  # auto   -- system DNS, falling back to DNS-over-HTTPS if an ad blocker
  #           (AdGuard, Pi-hole) blackholes newrelic.com to 0.0.0.0
  # system -- system DNS only
  # doh    -- always resolve over DNS-over-HTTPS
  dns_mode: auto
  environment: ""       # optional label attached to every data point

dashboard:
  host: 0.0.0.0
  port: 8000
  # STRONGLY recommended. Without these the dashboard is unauthenticated and
  # exposes masked emails, schedule ids and appointment dates.
  username: admin
  password: ""
  # /metrics normally sits behind the same auth. Set false when a scraper on a
  # trusted network should read it without credentials in its own config file
  # (Prometheus does not expand ${ENV} in scrape configs).
  metrics_require_auth: true

# ---------------------------------------------------------------------------
# Targets that every account inherits unless it overrides them.
#
# consulates accepts names, consular post codes, airport codes or raw facility
# ids -- these are all equivalent:
#   [Toronto, Vancouver] / [TRT, VAN] / [YYZ, YVR] / [94, 95]
#
#   Calgary CAL 89 | Halifax HAL 90 | Montreal MTL 91 | Ottawa OTT 92
#   Quebec City QUB 93 | Toronto TRT 94 | Vancouver VAN 95
# ---------------------------------------------------------------------------
defaults:
  consulates: [TRT]
  earliest_acceptable_date: 2026-09-01
  latest_acceptable_date: 2026-12-30
  # true  -> poll every listed consulate, take the globally earliest match
  # false -> walk the list in order and take the first match
  prefer_earliest: true
  # Date ranges to refuse even if offered.
  exclusions: []
  #  - [2026-10-01, 2026-10-15]
  #  - { from: 2026-11-20, to: 2026-11-25 }

accounts:
  - name: Primary
    email: you@example.com
    password: ""

    # Omit `applications` entirely to auto-discover every application on the
    # account that the site still offers a scheduling action for. Each one then
    # inherits the target above.
    #
    # List them explicitly to control which are touched and to give each its own
    # consulates / date window. schedule_id is the number in the AIS URL:
    #   https://ais.usvisa-info.com/en-ca/niv/schedule/72856817/continue_actions
    #                                                  ^^^^^^^^
    applications:
      - schedule_id: "72856817"
        label: Applicant A
        consulates: [TRT, VAN]
        latest_acceptable_date: 2026-12-30

      - schedule_id: "72856546"
        label: Applicant B
        # inherits consulates and dates from the account / defaults

    # Optional: a joint constraint across two or more of the applications
    # above. Unlike the per-application consulates, a group is not satisfied
    # by each member finding its own best day -- every member must land on
    # the *same* day, and only once that day has enough capacity for all of
    # them (min_slots, summed across their /times.json results). Below that
    # threshold the day is left for the next sweep instead of racing members
    # against each other for the last slot.
    #
    # A consulate listed in a group must NOT also appear in a member's own
    # `consulates` list above -- the group takes over that consulate
    # entirely for its members.
    # groups:
    #   - members: ["72856817", "72856546"]
    #     consulates: [MTL]
    #     latest_acceptable_date: 2026-12-31
    #     min_slots: 2

  # Add as many accounts as you like; the dashboard counts and groups them.
  # - name: Secondary
  #   email: other@example.com
  #   password: ""
  #   consulates: [VAN]
  #   latest_acceptable_date: 2027-03-31
